{% load static %}
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIウィザード - ChemML</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .demo-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .demo-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .demo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .demo-card h3 {
            margin-bottom: 10px;
        }

        .demo-card p {
            font-size: 14px;
            opacity: 0.9;
        }

        .recommendation {
            background: #f0f4ff;
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .metric:last-child {
            border-bottom: none;
        }

        .metric-label {
            font-weight: 600;
            color: #333;
        }

        .metric-value {
            color: #667eea;
            font-weight: 700;
            font-size: 18px;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .warning {
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .artifact-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .progress-bar {
            background: #e0e0e0;
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧙 AIウィザード</h1>
        <p class="subtitle">AIがあなたのデータを分析し、最適な機械学習設定を自動推奨します</p>

        <!-- Step 1: データ選択 -->
        <div class="step active" id="step1">
            <h2>Step 1: データを選択</h2>
            <p>分析したいデータセットを選んでください</p>
            <div class="demo-selector" id="demo-list"></div>
        </div>

        <!-- Step 2: 分析中 -->
        <div class="step" id="step2">
            <div class="loading">
                <div class="spinner"></div>
                <h3 style="margin-top: 20px;">データを分析中...</h3>
                <p>AIがあなたのデータに最適な設定を探しています</p>
            </div>
        </div>

        <!-- Step 3: 推奨結果 -->
        <div class="step" id="step3">
            <h2>✅ 分析完了！推奨設定</h2>
            <div id="warnings-container"></div>
            <div class="recommendation">
                <h3 style="margin-bottom: 20px;">📊 あなたのデータに最適な設定</h3>
                <div class="metric"><span class="metric-label">タスクタイプ</span><span class="metric-value"
                        id="task-type"></span></div>
                <div class="metric"><span class="metric-label">推奨モデル</span><span class="metric-value" id="model"></span>
                </div>
                <div class="metric"><span class="metric-label">特徴量</span><span class="metric-value"
                        id="features"></span></div>
                <div class="metric"><span class="metric-label">予想精度</span><span class="metric-value"
                        id="accuracy"></span></div>
                <div class="metric"><span class="metric-label">予想時間</span><span class="metric-value" id="time"></span>
                </div>
            </div>
            <div id="reasoning-container" style="margin-top: 20px;"></div>
            <button class="btn" onclick="startTraining()">🚀 この設定で学習開始</button>
            <button class="btn btn-secondary" onclick="goBack()">← 別のデータで試す</button>
        </div>

        <!-- Step 4: 学習中 -->
        <div class="step" id="step4">
            <h2>🔄 学習実行中...</h2>
            <div style="background: #f0f4ff; padding: 30px; border-radius: 15px; margin: 20px 0;">
                <div class="progress-bar">
                    <div id="progress-bar-fill" class="progress-fill"></div>
                </div>
                <p id="progress-message" style="text-align: center; color: #666;">初期化中...</p>
            </div>
            <p style="text-align: center; color: #888; margin-top: 20px;">
                このまましばらくお待ちください。<br>学習が完了すると自動的に結果が表示されます。
            </p>
        </div>

        <!-- Step 5: 結果 -->
        <div class="step" id="step5">
            <h2>🎉 学習完了！</h2>
            <div class="recommendation">
                <h3 style="margin-bottom: 20px;">📈 学習結果</h3>
                <div id="metrics-container"></div>
            </div>
            <h3 style="margin-top: 30px;">📊 可視化</h3>
            <div id="artifacts-container"
                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px;">
            </div>
            <button class="btn" onclick="window.location.href='/experiments'">実験一覧を見る</button>
            <button class="btn btn-secondary" onclick="window.location.reload()">別のモデルを作成</button>
        </div>
    </div>

    <script>
        let selectedDataset = null;
        let recommendation = null;
        let currentExperimentId = null;

        async function loadDemoDatasets() {
            try {
                const response = await fetch('/api/demo/datasets');
                const data = await response.json();
                const list = document.getElementById('demo-list');
                list.innerHTML = '';
                data.datasets.forEach(ds => {
                    const card = document.createElement('div');
                    card.className = 'demo-card';
                    card.onclick = () => selectDataset(ds);
                    card.innerHTML = `<h3>${ds.name_ja}</h3><p>${ds.n_molecules}分子</p><p>${ds.description}</p>`;
                    list.appendChild(card);
                });
            } catch (error) {
                console.error('Failed to load datasets:', error);
            }
        }

        async function selectDataset(dataset) {
            selectedDataset = dataset;
            showStep(2);
            await analyzeDataset(dataset.id);
        }

        async function analyzeDataset(datasetId) {
            try {
                const loadResponse = await fetch(`/api/demo/datasets/${datasetId}`);
                const loadData = await loadResponse.json();
                const analyzeResponse = await fetch('/api/wizard/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        csv_data: loadData.preview,
                        target_column: loadData.info.target_column,
                        smiles_column: loadData.info.smiles_column
                    })
                });
                recommendation = await analyzeResponse.json();
                displayRecommendation();
            } catch (error) {
                console.error('Analysis failed:', error);
                alert('分析に失敗しました');
                goBack();
            }
        }

        function displayRecommendation() {
            document.getElementById('task-type').textContent = recommendation.task_type_display;
            document.getElementById('model').textContent = recommendation.model_display;
            document.getElementById('features').textContent = recommendation.features_display.join(', ');
            document.getElementById('accuracy').textContent = recommendation.estimated_accuracy;
            document.getElementById('time').textContent = recommendation.estimated_time;

            const warningsContainer = document.getElementById('warnings-container');
            if (recommendation.warnings && recommendation.warnings.length > 0) {
                warningsContainer.innerHTML = recommendation.warnings.map(w =>
                    `<div class="warning">⚠️ ${w}</div>`
                ).join('');
            }

            if (recommendation.reasoning && recommendation.reasoning.model) {
                document.getElementById('reasoning-container').innerHTML = `
                    <div style="background: #e8f4f8; padding: 20px; border-radius: 10px;">
                        <h4 style="margin-bottom: 10px;">💡 なぜこの設定？</h4>
                        <p>${recommendation.reasoning.model}</p>
                    </div>
                `;
            }
            showStep(3);
        }

        async function startTraining() {
            if (!selectedDataset || !recommendation) {
                alert('データセットまたは推奨結果がありません');
                return;
            }

            showStep(4);
            document.getElementById('progress-message').textContent = '学習を開始しています...';
            document.getElementById('progress-bar-fill').style.width = '5%';

            try {
                const response = await fetch('/api/training/start-from-wizard', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        dataset_id: selectedDataset.id,
                        wizard_recommendation: {
                            task_type: recommendation.task_type,
                            model: recommendation.model,
                            features: recommendation.features
                        },
                        experiment_name: `${selectedDataset.name_ja} - ${recommendation.model_display}`
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || '学習開始に失敗しました');

                currentExperimentId = data.experiment_id;
                pollProgress();
            } catch (error) {
                console.error('Training start failed:', error);
                alert(`エラー: ${error.message}`);
                goBack();
            }
        }

        async function pollProgress() {
            if (!currentExperimentId) return;

            try {
                const response = await fetch(`/api/training/status/${currentExperimentId}`);
                const data = await response.json();

                document.getElementById('progress-bar-fill').style.width = `${data.progress}%`;
                document.getElementById('progress-message').textContent = data.current_step;

                if (data.status === 'COMPLETED') {
                    await showResults();
                } else if (data.status === 'FAILED') {
                    alert('学習に失敗しました');
                    goBack();
                } else {
                    setTimeout(pollProgress, 2000);
                }
            } catch (error) {
                console.error('Progress poll failed:', error);
            }
        }

        async function showResults() {
            try {
                const response = await fetch(`/api/training/results/${currentExperimentId}`);
                const data = await response.json();
                showStep(5);
                displayMetrics(data.metrics);
                displayArtifacts(data.artifacts);
            } catch (error) {
                console.error('Failed to load results:', error);
                alert('結果の取得に失敗しました');
            }
        }

        function displayMetrics(metrics) {
            const container = document.getElementById('metrics-container');
            container.innerHTML = '';
            const mainMetrics = {
                'train_r2': 'R² スコア',
                'train_rmse': 'RMSE',
                'train_mae': 'MAE',
                'cv_mean_score': 'CV平均スコア',
                'train_accuracy': '精度',
                'train_f1': 'F1スコア'
            };
            for (const [key, label] of Object.entries(mainMetrics)) {
                if (metrics[key] !== undefined) {
                    const metricDiv = document.createElement('div');
                    metricDiv.className = 'metric';
                    metricDiv.innerHTML = `
                        <span class="metric-label">${label}</span>
                        <span class="metric-value">${metrics[key].toFixed(3)}</span>
                    `;
                    container.appendChild(metricDiv);
                }
            }
        }

        function displayArtifacts(artifacts) {
            const container = document.getElementById('artifacts-container');
            container.innerHTML = '';
            artifacts.forEach(artifact => {
                const card = document.createElement('div');
                card.className = 'artifact-card';
                card.innerHTML = `
                    <img src="${artifact.url}" alt="${artifact.name}" style="width: 100%; border-radius: 8px;">
                    <p style="margin-top: 10px; text-align: center; font-size: 14px;">${artifact.name}</p>
                `;
                container.appendChild(card);
            });
        }

        function showStep(stepNum) {
            document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
            document.getElementById(`step${stepNum}`).classList.add('active');
        }

        function goBack() {
            showStep(1);
            selectedDataset = null;
            recommendation = null;
        }

        document.addEventListener('DOMContentLoaded', loadDemoDatasets);
    </script>
</body>

</html>
